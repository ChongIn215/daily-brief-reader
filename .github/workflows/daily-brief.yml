name: Generate daily brief

on:
  schedule:
    - cron: "0 0 * * *" # 08:00 China Standard Time
  workflow_dispatch:
    inputs:
      brief_date:
        description: "Optional edition date (YYYY-MM-DD), for example a missed day"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-brief-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's edition (Gemini first, DeepSeek fallback)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TZ: Asia/Shanghai
          BRIEF_DATE: ${{ inputs.brief_date }}
        run: python scripts/generate_daily.py

      - name: Publish the dated edition
        env:
          TZ: Asia/Shanghai
          BRIEF_DATE: ${{ inputs.brief_date }}
        run: |
          BRIEF_DATE="${BRIEF_DATE:-$(date +%F)}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "content/${BRIEF_DATE}.json"
          if git diff --cached --quiet; then
            echo "${BRIEF_DATE} edition did not change; nothing to publish."
            exit 0
          fi
          git commit -m "Publish daily brief for ${BRIEF_DATE}"
          git push
